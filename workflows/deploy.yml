name: Continuous Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Run Tests
        run: |
          npm ci || npm install
          npm test

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRUD_3FD86 }}'
          channelId: live
          projectId: crud-3fd86
        continue-on-error: true

      - name: Deployment Completion Summary
        run: |
          echo "======================================================="
          echo " Deployment pipeline executed successfully."
          echo " Project: Geography Edu - High School Help Kit"
          echo " Environment: Production"
          echo "======================================================="
