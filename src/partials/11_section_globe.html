  <section id="section-globe" class="globe-section">
    <!-- Mobile Controls Toggle Button -->
    <button class="globe-controls-toggle-btn" id="globe-controls-toggle-btn" onclick="toggleGlobeControls()" title="Tùy chỉnh Địa Cầu" aria-label="Globe Controls">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span data-i18n="globeControlsBtn">Tùy chỉnh</span>
    </button>

    <!-- Floating Quick Zoom Pill (Always accessible on mobile) -->
    <div class="globe-quick-zoom" id="globe-quick-zoom">
      <button class="globe-ctrl-btn" onclick="GlobeEngine.zoomIn()" title="Phóng to" aria-label="Zoom in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="globe-ctrl-btn" onclick="GlobeEngine.zoomOut()" title="Thu nhỏ" aria-label="Zoom out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="globe-ctrl-btn" onclick="GlobeEngine.resetView()" title="Đặt lại góc nhìn" aria-label="Reset view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.68"/></svg>
      </button>
    </div>

    <!-- Globe Controls Panel -->
    <div class="globe-controls-panel" id="globe-controls-panel">
      <!-- Mobile Panel Header with Close Button -->
      <div class="globe-controls-header">
        <div class="globe-controls-header-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span data-i18n="globeControlsTitle">Bảng điều khiển Địa Cầu</span>
        </div>
        <button class="globe-controls-close-btn" onclick="toggleGlobeControls(false)" aria-label="Close controls">&times;</button>
      </div>

      <div class="globe-control-group globe-desktop-zoom">
        <button class="globe-ctrl-btn" id="globe-btn-zoom-in" onclick="GlobeEngine.zoomIn()" title="Phong to" aria-label="Zoom in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="globe-ctrl-btn" id="globe-btn-zoom-out" onclick="GlobeEngine.zoomOut()" title="Thu nho" aria-label="Zoom out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="globe-ctrl-btn" id="globe-btn-reset" onclick="GlobeEngine.resetView()" title="Dat lai goc nhin" aria-label="Reset view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.68"/></svg>
        </button>
      </div>

    <!-- View Mode Toggle -->
      <div class="globe-control-group globe-mode-group">
        <label class="globe-ctrl-label" data-i18n="globeControlMode">Chế độ hiển thị</label>
        <div class="globe-mode-toggle" id="globe-mode-toggle">
          <button class="globe-mode-btn active" id="globe-mode-btn-satellite"
            onclick="globeSetMode('satellite')" title="Anh ve tinh NASA" aria-label="Satellite mode">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span data-i18n="globeModeSatellite">Ve tinh</span>
          </button>
          <button class="globe-mode-btn" id="globe-mode-btn-map"
            onclick="globeSetMode('map')" title="Ban do chinh tri" aria-label="Political map mode">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
            </svg>
            <span data-i18n="globeModeMap">Ban do</span>
          </button>
          <a href="https://www.windy.com/?21.018,105.846,5" target="_blank" rel="noopener noreferrer"
            class="globe-mode-btn globe-mode-btn-windy" title="Mo ban do khi tuong gio bao thoi gian thuc tren Windy.com (tab moi)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
            <span data-i18n="globeModeWindy">Khí tượng</span>
          </a>
        </div>
      </div>

      <!-- Windy Weather Map Quick Link Card -->
      <div class="globe-control-group">
        <a href="https://www.windy.com/?21.018,105.846,5" target="_blank" rel="noopener noreferrer" class="globe-windy-card-link" title="Mo ban do khi tuong toan cau Windy.com">
          <div class="globe-windy-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
          </div>
          <div class="globe-windy-info">
            <span class="globe-windy-title" data-i18n="globeWindyTitle">Bản đồ Khí tượng Windy</span>
            <span class="globe-windy-subtitle" data-i18n="globeWindySub">Theo dõi gió, bão, mây mưa vệ tinh</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="globe-windy-ext-icon">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>

      <!-- Map Mode Legend -->
      <div class="globe-control-group globe-legend" id="globe-map-legend" style="display:none;">
        <label class="globe-ctrl-label" data-i18n="globeLegendTitle">Chú thích vùng</label>
        <div class="globe-legend-items">
          <div class="globe-legend-item"><span class="globe-legend-dot" style="background:#22c55e"></span><span data-i18n="globeLegendAsia">Châu Á</span></div>
          <div class="globe-legend-item"><span class="globe-legend-dot" style="background:#3b82f6"></span><span data-i18n="globeLegendEurope">Châu Âu</span></div>
          <div class="globe-legend-item"><span class="globe-legend-dot" style="background:#f59e0b"></span><span data-i18n="globeLegendAmericas">Châu Mỹ</span></div>
          <div class="globe-legend-item"><span class="globe-legend-dot" style="background:#ef4444"></span><span data-i18n="globeLegendAfrica">Châu Phi</span></div>
          <div class="globe-legend-item"><span class="globe-legend-dot" style="background:#a855f7"></span><span data-i18n="globeLegendOceania">Châu Đại Dương</span></div>
        </div>
      </div>

      <!-- Map Theme Toggle (light / dark) - shown only in map mode -->
      <div class="globe-control-group" id="globe-map-theme-group" style="display:none;">
        <label class="globe-ctrl-label" data-i18n="globeThemeTitle">Giao diện bản đồ</label>
        <div class="globe-mode-toggle" id="globe-theme-toggle">
          <button class="globe-mode-btn active" id="globe-theme-btn-light"
            onclick="globeSetMapTheme('light')" title="Ban do sang" aria-label="Light map">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span data-i18n="globeThemeLight">Sáng</span>
          </button>
          <button class="globe-mode-btn" id="globe-theme-btn-dark"
            onclick="globeSetMapTheme('dark')" title="Ban do toi" aria-label="Dark map">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span data-i18n="globeThemeDark">Tối</span>
          </button>
        </div>
      </div>

      <div class="globe-control-group" id="globe-group-daytime">
        <label class="globe-ctrl-label" data-i18n="globeControlDayNight">Gio UTC</label>
        <div class="globe-slider-wrap">
          <span class="globe-slider-icon">&#9728;</span>
          <input type="range" id="globe-slider-hour" class="globe-slider" min="0" max="23" value="12" step="1"
            oninput="GlobeEngine.setDayNight(parseInt(this.value)); document.getElementById('globe-hour-display').textContent = this.value + 'h UTC'">
          <span class="globe-slider-icon">&#9790;</span>
        </div>
        <span class="globe-ctrl-value" id="globe-hour-display">12h UTC</span>
      </div>

      <div class="globe-control-group">
        <label class="globe-ctrl-label" data-i18n="globeControlYear">Nam du lieu</label>
        <div class="globe-slider-wrap">
          <input type="range" id="globe-slider-year" class="globe-slider" min="2020" max="2024" value="2024" step="1"
            oninput="GlobeEngine.setYear(parseInt(this.value)); document.getElementById('globe-year-display').textContent = this.value">
        </div>
        <span class="globe-ctrl-value" id="globe-year-display">2024</span>
      </div>
    </div>


    <!-- Country Explorer Bar (Search & Region Filters) -->
    <div class="globe-search-bar" id="globe-search-bar">
      <div class="globe-search-input-wrap">
        <svg class="globe-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="globe-search-input" class="globe-search-input"
          placeholder="Tìm quốc gia trong 193 nước... (VD: Việt Nam, Hoa Kỳ, Nhật Bản)"
          autocomplete="off" spellcheck="false"
          oninput="GlobeEngine.onSearchInput(this.value)"
          onfocus="GlobeEngine.onSearchFocus()">
        <button class="globe-search-clear-btn" id="globe-search-clear" onclick="GlobeEngine.clearSearch()" style="display:none;" title="Xóa">&times;</button>
      </div>

      <!-- Quick Region Filter Buttons -->
      <div class="globe-region-pills" id="globe-region-pills">
        <button class="globe-pill-btn active" data-region="all" onclick="GlobeEngine.filterRegion('all', this)">Tất cả (195)</button>
        <button class="globe-pill-btn" data-region="Asia" onclick="GlobeEngine.filterRegion('Asia', this)">Châu Á (48)</button>
        <button class="globe-pill-btn" data-region="Europe" onclick="GlobeEngine.filterRegion('Europe', this)">Châu Âu (44)</button>
        <button class="globe-pill-btn" data-region="Americas" onclick="GlobeEngine.filterRegion('Americas', this)">Châu Mỹ (35)</button>
        <button class="globe-pill-btn" data-region="Africa" onclick="GlobeEngine.filterRegion('Africa', this)">Châu Phi (54)</button>
        <button class="globe-pill-btn" data-region="Oceania" onclick="GlobeEngine.filterRegion('Oceania', this)">Châu Đại Dương (14)</button>
      </div>

      <!-- Search Suggestions Dropdown -->
      <div class="globe-search-dropdown" id="globe-search-dropdown" style="display:none;"></div>
    </div>

    <!-- Globe Canvas Container -->
    <div id="globe-3d-canvas" class="globe-canvas-container"></div>

    <!-- Globe Hint Overlay (shown before any country is clicked) -->
    <div class="globe-hint-overlay" id="globe-hint-overlay">
      <div class="globe-hint-card">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <p data-i18n="globeHintClick">Bam vao 1 quoc gia de xem thong tin chi tiet</p>
        <p class="globe-hint-sub" data-i18n="globeHintDrag">Keo de xoay, cuon chuot de phong to/thu nho</p>
      </div>
    </div>

    <!-- Country Info Side Panel (slides in from right) -->
    <div id="globe-country-panel" class="globe-country-panel">
      <!-- Content is dynamically injected by GlobeEngine.showCountryPanel() -->
    </div>
  </section>

  <!-- Globe Country Edit Modal (Admin/Developer only) -->
  <div id="modal-globe-edit" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="globe-edit-modal-title">
    <div class="modal-content modal-md">
      <div class="modal-header">
        <h3 class="modal-title" id="globe-edit-modal-title" data-i18n="globeEditModalTitle">Chinh Sua So Lieu Quoc Gia</h3>
        <button class="modal-close-btn" onclick="closeModal('modal-globe-edit')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="globe-edit-modal-body">
        <!-- Dynamically filled by openGlobeEditModal() -->
      </div>
    </div>
  </div>
  <!-- ========================= /GLOBE 3D SECTION ========================= -->
