  <!-- Main View Container -->
  <main class="main-view-container">
    <div class="container">

      <div class="tab-view active" id="tab-view-saved">
        <div class="section-header">
          <div class="section-title-wrap">
            <h2 class="section-title">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              <span data-i18n="secSavedTitle">Bộ Sưu Tập Tài Liệu Đã Lưu</span>
            </h2>
            <p class="section-subtitle" data-i18n="secSavedDesc">Kho lưu trữ cá nhân giúp bạn ôn tập nhanh mọi lúc mọi
              nơi</p>
          </div>
          <div>
            <button type="button" class="btn btn-outline-primary" onclick="switchTab('documents')" style="display: inline-flex; align-items: center; gap: 6px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>Quay lại Kho tài liệu</span>
            </button>
          </div>
        </div>

        <!-- Guest Prompt if not logged in -->
        <div id="saved-guest-prompt" class="empty-state" style="display: none;">
          <div class="empty-state-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h3 data-i18n="savedGuestPromptTitle">Vui lòng đăng nhập để xem tài liệu đã lưu</h3>
          <p data-i18n="savedGuestPromptDesc">Tài khoản cá nhân giúp đồng bộ danh sách tài liệu yêu thích trên mọi thiết
            bị.</p>
          <div style="margin-top: 18px; display: flex; justify-content: center; gap: 10px;">
            <button class="btn btn-primary" data-i18n="btnLoginNow" onclick="openModal('modal-login')">Đăng nhập
              ngay</button>
            <button class="btn btn-secondary" data-i18n="btnRegisterAccount" onclick="openModal('modal-register')">Đăng
              ký tài khoản</button>
          </div>
        </div>

        <!-- Saved Documents Toolbar -->
        <div class="documents-view-toolbar" id="saved-docs-view-toolbar" style="display: none;">
          <div class="docs-count-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="saved-docs-count-text">Tài liệu đã lưu</span>
          </div>
          <div class="docs-toolbar-actions">
            <span class="scroll-hint-text" data-i18n="scrollHint">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M19 12l-7 7-7-7" />
              </svg>
              Cuộn để xem tiếp
            </span>
            <button class="btn btn-sm btn-view-mode" id="btn-toggle-saved-doc-scroll"
              onclick="toggleDocScrollMode('saved-documents-scroll-wrapper', this)"
              title="Chuyển đổi chế độ cuộn gọn hoặc mở rộng toàn bộ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
              <span data-i18n="scrollModeExpand">Mở rộng toàn bộ</span>
            </button>
          </div>
        </div>

        <!-- Saved Documents Scroll Wrapper -->
        <div class="documents-scroll-wrapper" id="saved-documents-scroll-wrapper">
          <div class="documents-grid" id="saved-documents-grid">
            <!-- Rendered dynamically by js/app.js -->
          </div>
        </div>
      </div>

    </div>
  </main>
